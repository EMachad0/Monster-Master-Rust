# Pinned toolchain for the whole workspace. Must be >= the MSRV SpacetimeDB's crates declare
# (their `rust-version`).
# rustup auto-installs this toolchain, the listed components, and the wasm target on first use.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
