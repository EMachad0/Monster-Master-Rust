[package]
name = "stdb_bevy"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Exposes `stdb_bevy::test_support` (fakes + `test_app`) to downstream crates and the public-API
# e2e suite under `tests/`. Off by default, so it never bloats production builds.
test-support = []

# No SpacetimeDB SDK dependency here, deliberately: the SDK is reachable only from `stdb_bevy_sdk`,
# so a stray SDK reference in this crate fails to build instead of merely tripping a lint.
[dependencies]
bevy.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
rand.workspace = true
smallvec.workspace = true

# Enables `test-support` when building this crate's own integration tests under `tests/`
# (they need the public fakes). A self-dev-dependency is the standard way to turn a feature on for
# the integration-test build only.
[dev-dependencies]
stdb_bevy = { path = ".", features = ["test-support"] }
