[package]
name = "stdb_bevy"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bevy.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
spacetimedb-sdk.workspace = true
rand.workspace = true
http.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The SDK's browser websocket path (gloo-net). Native uses the default tokio path; only wasm needs
# this. Feature unification means enabling it here also applies to stdb_bindings' SDK on wasm.
spacetimedb-sdk = { workspace = true, features = ["browser"] }
# getrandom needs its JS backend in the browser (see .cargo/config.toml for the matching cfg).
# getrandom = { workspace = true, features = ["wasm_js"] }
# Drives the SDK's async build()/connection on the browser's event loop.
wasm-bindgen-futures = { workspace = true }
